<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14532D" />
      <stop offset="60%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#86EFAC" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer AI Orbit Ring -->
  <circle cx="50" cy="50" r="44" stroke="#22C55E" stroke-opacity="0.25" stroke-width="2.5" stroke-dasharray="6 4" />
  
  <!-- Modern Geometric Sprout Leaf Base -->
  <path d="M50 86 C50 65 32 50 20 48 C20 68 36 86 50 86 Z" fill="url(#leafGrad)" />
  <path d="M50 86 C50 58 72 38 82 24 C84 46 68 84 50 86 Z" fill="url(#leafGrad)" />
  
  <!-- Central Stem & Neural Network Traces -->
  <path d="M50 86 V38" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- AI Neural Branch Nodes -->
  <path d="M50 58 L36 46" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  <path d="M50 48 L66 36" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  <path d="M50 38 L50 22" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  
  <!-- Glowing AI Nodes (Sunlight Yellow Accent) -->
  <circle cx="36" cy="46" r="4" fill="url(#aiGrad)" filter="url(#glow)" />
  <circle cx="66" cy="36" r="4.5" fill="url(#aiGrad)" filter="url(#glow)" />
  <circle cx="50" cy="20" r="5" fill="url(#aiGrad)" filter="url(#glow)" />
  <circle cx="82" cy="24" r="3.5" fill="#22C55E" />
</svg>
